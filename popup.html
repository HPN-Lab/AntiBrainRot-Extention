<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayFree</title>
    <link href="dist/styles.css" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/all.min.css">
</head>
<body class="theme-app-bg m-0 min-w-[320px] w-[min(400px,100vw)] font-sans antialiased">
<div id="popup-root" class="theme-surface theme-border relative min-h-[360px] shadow-[0_20px_48px_rgba(23,34,64,0.12)]">
    <div id="main-screen" class="block">
        <div class="pointer-events-none absolute -left-10 -top-10 h-28 w-28 rounded-full bg-indigo-200/20 blur-3xl"></div>
        <div class="pointer-events-none absolute inset-x-0 top-0 h-24 bg-gradient-to-b from-slate-50 to-white"></div>

        <div class="relative px-3 pb-3 pt-2 sm:px-4 sm:pb-4">
            <header class="flex items-center justify-between gap-3 px-1 py-3">
                <div class="flex min-w-0 items-center gap-3">
                    <div class="theme-brand-gradient grid h-10 w-10 place-items-center rounded-full shadow-[0_10px_18px_rgba(244,140,43,0.24)]">
                        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px] fill-[#fff9e8]" aria-hidden="true">
                            <path d="M12 2.5l2.82 5.72 6.31.92-4.56 4.44 1.08 6.28L12 16.94l-5.65 2.92 1.08-6.28-4.56-4.44 6.31-.92L12 2.5z"></path>
                        </svg>
                    </div>

                    <div class="min-w-0">
                        <h1 class="theme-title m-0 text-[24px] font-bold tracking-[-0.04em]">AntiDoom</h1>
                    </div>

                    <button id="global-active-toggle" type="button" aria-label="Global active toggle" aria-pressed="true" class="theme-switch is-on">
                        <span class="theme-switch-thumb"></span>
                    </button>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <button type="button" class="theme-button h-10 w-10 rounded-full border-0 text-[14px] font-semibold shadow-[0_6px_18px_rgba(15,23,42,0.08)] transition sm:h-12 sm:w-12">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                    <button type="button" id="expand-btn" class="theme-button grid h-10 w-10 place-items-center rounded-full border-0 shadow-[0_6px_18px_rgba(15,23,42,0.08)] transition sm:h-12 sm:w-12">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </header>

            <section id="site-status-card" class="theme-surface theme-border mt-3 rounded-[18px] border p-3 shadow-[0_8px_22px_rgba(15,23,42,0.06)] transition sm:p-4">
                <div class="mb-4 flex flex-col items-start gap-3">
                    <div class="flex w-full items-start justify-between gap-3">
                        <div class="min-w-0">
                            <p class="theme-primary-text m-0 text-[12px] font-semibold uppercase tracking-[0.12em]">You are currently on:</p>
                            <h2 id="active-website-name" class="theme-title mt-1 truncate text-[24px] font-bold tracking-[-0.04em]">Website</h2>
                        </div>
                        <div id="current-site-badge" class="theme-status-chip shrink-0 rounded-full px-3 py-2 text-[14px] font-bold uppercase tracking-[0.06em]">
                            Tracking
                        </div>
                    </div>
                    <p id="active-website-url" class="theme-muted w-full break-all text-[12px]">https://example.com</p>
                </div>

                <div id="disabled-message" class="hidden rounded-2xl bg-slate-100 px-4 py-4 text-center text-[16px] font-semibold text-slate-500">
                    Extension is currently Disabled
                </div>

                <div id="site-status-content" class="theme-soft-surface flex flex-col gap-3 rounded-2xl px-3 py-3 transition sm:flex-row sm:items-center sm:gap-4">
                    <div id="status-icon-shell" class="grid h-12 w-12 place-items-center overflow-hidden rounded-[14px] bg-slate-200">
                        <img id="site-favicon" alt="" class="hidden h-7 w-7 rounded-md object-cover" referrerpolicy="no-referrer">
                        <svg id="status-icon" viewBox="0 0 24 24" class="h-7 w-7 fill-slate-600" aria-hidden="true">
                            <path d="M12 2.75a9.25 9.25 0 1 0 9.25 9.25A9.26 9.26 0 0 0 12 2.75Zm0 16.5a7.25 7.25 0 1 1 7.25-7.25A7.26 7.26 0 0 1 12 19.25Z"></path>
                            <path d="M12.75 7h-1.5v6l5 3 .75-1.23-4.25-2.52Z"></path>
                        </svg>
                    </div>

                    <div class="min-w-0 flex-1">
                        <div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between sm:gap-3">
                            <p id="time-remaining-label" class="theme-title truncate text-[18px] font-semibold tracking-[-0.03em]">Time Remaining</p>
                            <p id="time-remaining-value" class="theme-title shrink-0 text-[24px] font-bold tracking-[-0.05em] [font-variant-numeric:tabular-nums]">--:--</p>
                        </div>
                        <p id="active-website-note" class="theme-muted mt-1 text-[12px]">Popup da san sang.</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div id="opening-timer-wait-screen" class="hidden min-h-[360px] bg-slate-950 px-6 py-8 text-center text-white">
        <div class="flex min-h-[360px] flex-col items-center justify-center gap-5">
            <p class="text-[12px] font-semibold uppercase tracking-[0.16em] text-amber-300/80">Opening Timer</p>
            <h2 class="text-[30px] font-extrabold tracking-tight text-amber-300">Stay Focused</h2>
            <p id="opening-timer-message" class="max-w-[18rem] text-[16px] leading-7 text-slate-200">
                Chậm lại một chút trước khi mở nội dung gây xao nhãng.
            </p>
            <p id="opening-timer-left-seconds" class="text-[48px] font-black tracking-[-0.06em] text-amber-300 [font-variant-numeric:tabular-nums]">
                00:00
            </p>
            <p class="text-[12px] text-slate-400">Khong the bo qua. Popup se mo sau khi dem nguoc ket thuc.</p>
        </div>
    </div>
</div>
<script src="scripts/popup.js"></script>
</body>
</html>
